<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFLECT</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    flex-wrap: wrap;
  }
  video {
    max-width: 48vw;
    max-height: 100vh;
    display: block;
  }
  @media (max-aspect-ratio: 1/1) {
    video { max-width: 100vw; max-height: 48vh; }
  }
</style>
</head>
<body>
  <video src="lucka.mp4" autoplay loop muted playsinline></video>
  <video src="lada.mp4" autoplay loop muted playsinline onloadedmetadata="this.playbackRate=1.5"></video>
</body>
</html>
